name: Arena AI Autonomous Sentinel (100%)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor-and-heal:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Разрешаем воркфлоу создавать тикеты в репозитории
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Site Health
        id: check
        continue-on-error: true
        run: |
          URL="https://твой-сайт.com"
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" $URL)
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "STATUS=FAIL" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "STATUS=OK" >> $GITHUB_OUTPUT
            echo "✅ Сайт работает стабильно (статус 200)."
          fi

      - name: 🚨 Auto-Create Issue on Failure
        if: steps.check.outputs.STATUS == 'FAIL'
        uses: actions/github-script@v6
        with:
          script: |
            const httpCode = '${{ steps.check.outputs.http_code }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔥 [SRE Alert] Сайт упал! Код ответа: ${httpCode}`,
              body: `Внимание! Автоматический мониторинг зафиксировал сбой.\n\n- **Время проверки:** ${new Date().toISOString()}\n- **HTTP Статус:** ${httpCode}\n- **Статус:** Требуется вмешательство разработчика или Arena AI.`
            });
            console.log("⚠️ Тикет об ошибке успешно создан в репозитории!");
