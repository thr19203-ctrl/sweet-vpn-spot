name: Autonomous Self-Healing Agent (OpenRouter)

on:
  workflow_dispatch:
  push:
  # Если хочешь, чтобы триггерилось и на PR, можно оставить push/workflow_dispatch

jobs:
  heal-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment & Run Tests
        id: run-tests
        run: |
          # Теперь если тесты падают, шаг завершается с ошибкой (будет честный красный крестик)
          npm test

      - name: Trigger AI Agent via OpenRouter
        if: failure()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Тесты упали! Пробуждаем ИИ через OpenRouter..."
          python3 -c "
          import os
          print('API Key status:', 'Loaded!' if os.environ.get('OPENROUTER_API_KEY') else 'Missing!')
          "
          # Здесь в будущем вызовем наш agent_runner.py

      - name: Create Pull Request
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(agent): auto-remediate bug detected by OpenRouter agent"
          branch: fix/openrouter-patch-${{ github.run_id }}
          title: "🤖 [Auto-Heal] AI Agent Remediation (via OpenRouter)"
          body: |
            ## 🐛 Bug Summary
            The automated CI pipeline caught a test failure.
            
            ## 🛠️ Automated Fix
            The Autonomous Agent powered by OpenRouter analyzed the error and applied a fix.
          base: main
