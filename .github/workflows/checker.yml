name: SRE Autopilot

# Two jobs:
#   verify — build/lint/typecheck/tests on every push, PR and on a schedule.
#   uptime — probes the deployed site and opens/closes an incident issue.
on:
  schedule:
    - cron: "0 0,4,9,14,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sre-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://sweet-vpn-spot.lovable.app

jobs:
  verify:
    name: Build · lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint .

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

  uptime:
    name: Live site uptime
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe the live site
        run: node scripts/health-check.mjs

      - name: Open or update the incident issue
        if: failure()
        uses: actions/github-script@v7
        env:
          SITE_URL: ${{ env.SITE_URL }}
        with:
          script: |
            const site = process.env.SITE_URL;
            const title = `🚨 Site is down: ${site}`;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Still down at ${new Date().toISOString()}.\n\nWorkflow run: ${runUrl}`,
              });
              core.info(`Updated existing incident #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  `The uptime probe could not load **${site}**.`,
                  "",
                  `- Detected at: ${new Date().toISOString()}`,
                  `- Workflow run: ${runUrl}`,
                  "",
                  "The probe fails when a page returns a non-2xx status or loses its expected markup after retries.",
                  "This issue closes automatically once the site is healthy again.",
                ].join("\n"),
              });
              core.info(`Opened incident #${created.number}`);
            }

      - name: Close resolved incidents
        if: success()
        uses: actions/github-script@v7
        env:
          SITE_URL: ${{ env.SITE_URL }}
        with:
          script: |
            const site = process.env.SITE_URL;
            const title = `🚨 Site is down: ${site}`;
            const { owner, repo } = context.repo;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incidents = openIssues.filter((issue) => issue.title === title);

            for (const issue of incidents) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `✅ Recovered — ${site} is healthy again (${new Date().toISOString()}).`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });
              core.info(`Closed incident #${issue.number}`);
            }
