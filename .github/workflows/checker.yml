name: SRE Autopilot

# Two jobs:
#   verify — build/lint/typecheck/tests on every push, PR and manual run.
#   uptime — probes the deployed site every 30 minutes and opens/closes an
#            incident issue. "Down" (pages unreachable) and "degraded"
#            (pages fine, an asset 404s) are reported separately.
on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs by a few minutes
    # during busy periods, and disables schedules after 60 days without
    # repository activity — any push keeps the schedule alive.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sre-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://sweet-vpn-spot.lovable.app

jobs:
  verify:
    name: Build · lint · types · tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint .

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

  uptime:
    name: Live site uptime
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Exit codes: 0 healthy, 1 outage (pages unreachable), 2 degraded
      # (a page loads but an asset it references is broken).
      - name: Probe the live site
        id: probe
        continue-on-error: true
        run: node scripts/health-check.mjs

      - name: Open or update the incident issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const report = JSON.parse(fs.readFileSync("health-report.json", "utf8"));

            const outage = report.status === "down";
            const title = `${outage ? "🚨 Site is down" : "⚠️ Site is degraded"}: ${report.site}`;
            const otherTitle = `${outage ? "⚠️ Site is degraded" : "🚨 Site is down"}: ${report.site}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            // A degraded site that becomes an outage (or recovers) should not
            // leave the previous severity open next to the new one.
            const stale = openIssues.find((issue) => issue.title === otherTitle);
            if (stale) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: stale.number,
                body: `Severity changed to ${outage ? "outage" : "degraded"} at ${new Date().toISOString()}.\n\nWorkflow run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: stale.number,
                state: "closed",
              });
            }

            const details = [
              ...report.pages
                .filter((page) => !page.ok)
                .map((page) => `- ❌ page \`${page.path}\`: ${page.error ?? `HTTP ${page.status}`}`),
              ...report.assets
                .filter((asset) => !asset.ok)
                .map(
                  (asset) =>
                    `- ❌ asset \`${new URL(asset.url).pathname}\`: ${asset.error ?? `HTTP ${asset.status}`}`,
                ),
            ].join("\n");

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Still failing at ${new Date().toISOString()}.\n\n${details}\n\nWorkflow run: ${runUrl}`,
              });
              core.info(`Updated incident #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  `The uptime probe found problems on **${report.site}** at ${report.checkedAt}.`,
                  "",
                  details,
                  "",
                  `- Workflow run: ${runUrl}`,
                  "",
                  "The probe retries every page three times before failing. This issue closes automatically once the site is healthy again.",
                ].join("\n"),
              });
              core.info(`Opened incident #${created.number}`);
            }

      - name: Close resolved incidents
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const site = process.env.SITE_URL;
            const titles = [`🚨 Site is down: ${site}`, `⚠️ Site is degraded: ${site}`];
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incidents = openIssues.filter((issue) => titles.includes(issue.title));

            for (const issue of incidents) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `✅ Recovered — ${site} is healthy again (${new Date().toISOString()}).\n\nWorkflow run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });
              core.info(`Closed incident #${issue.number}`);
            }

      - name: Fail the run so the outage stays visible
        if: steps.probe.outcome == 'failure'
        run: exit 1
